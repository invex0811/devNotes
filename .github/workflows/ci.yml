name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      # Reads the site path (/<repo>) from the repository's Pages settings.
      # Requires Pages to be enabled with "GitHub Actions" as the source.
      - name: Configure Pages
        id: pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Build
        run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          # Repository variables (Settings → Secrets and variables → Actions → Variables).
          # They end up in the public site code by design; see docs/SETUP_GOOGLE.md.
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_API_KEY: ${{ vars.VITE_GOOGLE_API_KEY }}
          VITE_GOOGLE_APP_ID: ${{ vars.VITE_GOOGLE_APP_ID }}
          # Shows the install command on the "Connect Claude Code" page.
          VITE_DEVNOTES_MCP: ${{ vars.DEVNOTES_MCP_CLIENT_ID != '' && '1' || '' }}

      # The MCP server package that the "Connect Claude Code" page offers. The desktop
      # OAuth client is built into it; Google does not treat its secret as
      # confidential. See docs/MCP.md.
      - name: Pack MCP server for download
        working-directory: packages/mcp
        run: node build.mjs release ../../apps/web/dist
        env:
          DEVNOTES_MCP_SERVER_URL: ${{ steps.pages.outputs.base_url && format('{0}/devnotes-mcp/server.mjs', steps.pages.outputs.base_url) || 'https://example.invalid/devnotes-mcp/server.mjs' }}
          DEVNOTES_MCP_CLIENT_ID: ${{ vars.DEVNOTES_MCP_CLIENT_ID }}
          DEVNOTES_MCP_CLIENT_SECRET: ${{ vars.DEVNOTES_MCP_CLIENT_SECRET }}

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Never cancel a deployment that is already running; queue the next one instead.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
